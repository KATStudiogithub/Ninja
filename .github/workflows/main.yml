name: Deploy Game to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and Build
        run: |
          if [ -f "package.json" ]; then
            npm install
            npm run build --if-present
          fi
          if [ -f "frontend/package.json" ]; then
            cd frontend
            npm install
            npx vite build --base=./ || npm run build
            cd ..
          fi
          mkdir -p deploy_dist
          if [ -d "frontend/dist" ]; then
            cp -r frontend/dist/* deploy_dist/
          elif [ -d "frontend/build" ]; then
            cp -r frontend/build/* deploy_dist/
          elif [ -d "dist" ]; then
            cp -r dist/* deploy_dist/
          elif [ -d "build" ]; then
            cp -r build/* deploy_dist/
          else
            cp -r frontend/* deploy_dist/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy_dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
