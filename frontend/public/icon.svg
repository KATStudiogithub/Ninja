<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 3D App Squircle Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Golden Outer Rim -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Full Moon Glow -->
    <radialGradient id="moonGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#fde047" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Pixar Royal Blue Ninja Hood -->
    <radialGradient id="hood3D" cx="38%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="35%" stop-color="#2563eb"/>
      <stop offset="78%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- 3D Pixar Lower Mask -->
    <linearGradient id="mask3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Subsurface Skin Tone -->
    <radialGradient id="skin3D" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="65%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </radialGradient>

    <!-- Crimson 3D Headband -->
    <linearGradient id="redBand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="45%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Katana Glowing Steel Blade -->
    <linearGradient id="katanaBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Pixar Sky Blue Iris -->
    <radialGradient id="irisGrad" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </radialGradient>

    <!-- Silver Metal Plate -->
    <linearGradient id="silverPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- 3D Drop Shadow Filter -->
    <filter id="shadow3D" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#020617" flood-opacity="0.7"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. App Icon Base Squircle & Gold Border -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="12"/>

  <!-- Subtle Inner Top Gloss -->
  <path d="M 55 24 Q 256 6 457 24 Q 492 50 492 120 Q 256 65 20 120 Q 20 50 55 24 Z" fill="#ffffff" opacity="0.08"/>

  <!-- 2. Mystical Full Moon Halo -->
  <circle cx="256" cy="210" r="185" fill="url(#moonGrad)"/>
  <circle cx="256" cy="195" r="128" fill="#fef9c3" opacity="0.15"/>

  <!-- Sparkle Stars in Background -->
  <g fill="#fef08a" opacity="0.85">
    <circle cx="88" cy="108" r="5"/>
    <circle cx="424" cy="96" r="6"/>
    <circle cx="72" cy="285" r="4"/>
    <circle cx="440" cy="275" r="5"/>
    <path d="M110 68 L114 80 L126 84 L114 88 L110 100 L106 88 L94 84 L106 80 Z"/>
    <path d="M402 64 L405 74 L415 77 L405 80 L402 90 L399 80 L389 77 L399 74 Z"/>
  </g>

  <!-- 3. Crossed 3D Katanas Behind Ninja -->
  <g filter="url(#shadow3D)">
    <!-- Left-to-Right Katana -->
    <g transform="translate(256, 235) rotate(-38)">
      <!-- Blade -->
      <path d="M -18 -230 L 18 -205 L 14 90 L -14 90 Z" fill="url(#katanaBlade)" stroke="#e0f2fe" stroke-width="3"/>
      <path d="M 0 -220 L 14 -205 L 10 90 L 0 90 Z" fill="#ffffff" opacity="0.55"/>
      <!-- Gold Guard (Tsuba) -->
      <rect x="-34" y="85" width="68" height="16" rx="8" fill="url(#goldRim)" stroke="#78350f" stroke-width="2"/>
      <!-- Red Wrapped Hilt -->
      <rect x="-13" y="101" width="26" height="85" rx="8" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
      <circle cx="0" cy="186" r="15" fill="url(#goldRim)"/>
    </g>

    <!-- Right-to-Left Katana -->
    <g transform="translate(256, 235) rotate(38)">
      <!-- Blade -->
      <path d="M -18 -230 L 18 -205 L 14 90 L -14 90 Z" fill="url(#katanaBlade)" stroke="#e0f2fe" stroke-width="3"/>
      <path d="M -14 -205 L 0 -220 L 0 90 L -10 90 Z" fill="#ffffff" opacity="0.55"/>
      <!-- Gold Guard (Tsuba) -->
      <rect x="-34" y="85" width="68" height="16" rx="8" fill="url(#goldRim)" stroke="#78350f" stroke-width="2"/>
      <!-- Red Wrapped Hilt -->
      <rect x="-13" y="101" width="26" height="85" rx="8" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
      <circle cx="0" cy="186" r="15" fill="url(#goldRim)"/>
    </g>
  </g>

  <!-- 4. Flowing Red Headband Tails -->
  <g filter="url(#shadow3D)">
    <path d="M 380 185 Q 455 155 482 195 Q 455 225 415 215 Z" fill="url(#redBand)"/>
    <path d="M 390 205 Q 465 205 476 248 Q 435 262 395 230 Z" fill="#b91c1c"/>
  </g>

  <!-- 5. 3D Pixar Chibi Ninja Head -->
  <g filter="url(#shadow3D)">
    <!-- Main Chubby Hood Sphere -->
    <ellipse cx="256" cy="232" rx="152" ry="146" fill="url(#hood3D)"/>

    <!-- Top 3D Specular Rim Highlight on Hood -->
    <ellipse cx="215" cy="128" rx="78" ry="32" fill="#ffffff" opacity="0.18" transform="rotate(-12 215 128)"/>

    <!-- Warm Peach Face Opening -->
    <rect x="128" y="172" width="256" height="106" rx="52" fill="url(#skin3D)" stroke="#1e293b" stroke-width="4"/>

    <!-- Cute Rosy Pixar Blush Cheeks -->
    <ellipse cx="156" cy="252" rx="18" ry="10" fill="#fb7185" opacity="0.65"/>
    <ellipse cx="356" cy="252" rx="18" ry="10" fill="#fb7185" opacity="0.65"/>

    <!-- Big Expressive Pixar Left Eye -->
    <g transform="translate(194, 224)">
      <ellipse cx="0" cy="0" rx="30" ry="34" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
      <ellipse cx="4" cy="2" rx="20" ry="24" fill="url(#irisGrad)"/>
      <circle cx="5" cy="2" r="12" fill="#090d16"/>
      <!-- Pixar Dual Catchlights -->
      <circle cx="-4" cy="-9" r="7.5" fill="#ffffff"/>
      <circle cx="11" cy="10" r="3.5" fill="#ffffff"/>
    </g>

    <!-- Big Expressive Pixar Right Eye -->
    <g transform="translate(318, 224)">
      <ellipse cx="0" cy="0" rx="30" ry="34" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
      <ellipse cx="-4" cy="2" rx="20" ry="24" fill="url(#irisGrad)"/>
      <circle cx="-5" cy="2" r="12" fill="#090d16"/>
      <!-- Pixar Dual Catchlights -->
      <circle cx="-11" cy="-9" r="7.5" fill="#ffffff"/>
      <circle cx="4" cy="10" r="3.5" fill="#ffffff"/>
    </g>

    <!-- Determined Heroic Eyebrows -->
    <path d="M 156 188 Q 195 192 226 206" fill="none" stroke="#0f172a" stroke-width="11" stroke-linecap="round"/>
    <path d="M 356 188 Q 317 192 286 206" fill="none" stroke="#0f172a" stroke-width="11" stroke-linecap="round"/>

    <!-- 3D Lower Face Mask Curve -->
    <path d="M 110 250 Q 256 292 402 250 Q 392 372 256 378 Q 120 372 110 250 Z" fill="url(#mask3D)"/>
    <!-- Mask Fold Highlight -->
    <path d="M 135 262 Q 256 298 377 262" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

    <!-- Crimson Red Headband (Hachimaki) -->
    <path d="M 104 155 Q 256 192 408 155 L 404 202 Q 256 236 108 202 Z" fill="url(#redBand)" stroke="#7f1d1d" stroke-width="3"/>

    <!-- Silver Forehead Plate with Multiplication '×' Emblem -->
    <rect x="202" y="158" width="108" height="44" rx="14" fill="url(#silverPlate)" stroke="#0f172a" stroke-width="3.5"/>
    <circle cx="218" cy="180" r="4" fill="#475569"/>
    <circle cx="294" cy="180" r="4" fill="#475569"/>
    <!-- Glowing Red Multiplication Cross on Forehead Plate -->
    <path d="M 244 168 L 268 192 M 268 168 L 244 192" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- 6. 3D Golden Sifir Banner at Bottom -->
  <g filter="url(#shadow3D)">
    <rect x="92" y="366" width="328" height="96" rx="34" fill="url(#goldRim)" stroke="#ffffff" stroke-width="6"/>
    <rect x="104" y="376" width="304" height="76" rx="26" fill="#0f172a"/>
    <!-- Math Sifir Equation Text -->
    <text x="256" y="429" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="54" fill="#fef08a" text-anchor="middle" letter-spacing="2">7 × 8 = 56</text>
  </g>
</svg>