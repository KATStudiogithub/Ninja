<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e1b4b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ninja Sifir 3D" />
  <link id="pwa-manifest-link" rel="manifest" href="public/manifest.webmanifest" />
  <link id="favicon-link" rel="icon" type="image/png" href="" />
  <link id="apple-touch-icon-link" rel="apple-touch-icon" href="" />
  <meta name="description" content="Permainan aksi 3D ninja pembelajaran sifir matematik 2 hingga 12. Boleh dimainkan secara luar talian!" />
  <title>NINJA SIFIR: RAGEBOUND 3D — Math Ninja</title>

  <!-- Capture beforeinstallprompt immediately & generate 3D Pixar PNG 192/512 Icons for Android/iOS Home Screen -->
  <script>
    window.__deferredPwaPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.__deferredPwaPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
    });

    (function setupAndroidWebApkManifest() {
      try {
        function createPixarPngIcon(size) {
          var c = document.createElement('canvas');
          c.width = size;
          c.height = size;
          var ctx = c.getContext('2d');
          if (!ctx) return '';
          var s = size / 512;

          // 1. 3D Squircle Background
          var bg = ctx.createRadialGradient(256 * s, 160 * s, 30 * s, 256 * s, 256 * s, 360 * s);
          bg.addColorStop(0, '#312e81');
          bg.addColorStop(0.55, '#1e1b4b');
          bg.addColorStop(1, '#090d16');
          ctx.fillStyle = bg;
          ctx.beginPath();
          ctx.roundRect(8 * s, 8 * s, 496 * s, 496 * s, 112 * s);
          ctx.fill();

          // Gold Outer Rim
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 12 * s;
          ctx.stroke();

          // 2. Moon Halo
          ctx.fillStyle = 'rgba(254, 249, 195, 0.16)';
          ctx.beginPath();
          ctx.arc(256 * s, 200 * s, 150 * s, 0, Math.PI * 2);
          ctx.fill();

          // 3. Crossed Katanas Behind Ninja
          function drawKatana(angleDeg) {
            ctx.save();
            ctx.translate(256 * s, 235 * s);
            ctx.rotate((angleDeg * Math.PI) / 180);
            ctx.fillStyle = '#bae6fd';
            ctx.fillRect(-14 * s, -220 * s, 28 * s, 300 * s);
            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(-32 * s, 80 * s, 64 * s, 14 * s);
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(-12 * s, 94 * s, 24 * s, 80 * s);
            ctx.restore();
          }
          drawKatana(-38);
          drawKatana(38);

          // 4. 3D Pixar Royal Blue Ninja Hood
          var hood = ctx.createRadialGradient(210 * s, 150 * s, 20 * s, 256 * s, 232 * s, 160 * s);
          hood.addColorStop(0, '#60a5fa');
          hood.addColorStop(0.4, '#2563eb');
          hood.addColorStop(1, '#0f172a');
          ctx.fillStyle = hood;
          ctx.beginPath();
          ctx.arc(256 * s, 232 * s, 148 * s, 0, Math.PI * 2);
          ctx.fill();

          // 5. Warm Peach Face Opening
          ctx.fillStyle = '#ffedd5';
          ctx.beginPath();
          ctx.roundRect(128 * s, 172 * s, 256 * s, 104 * s, 48 * s);
          ctx.fill();

          // 6. Big Expressive Pixar Eyes
          function drawEye(cx) {
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(cx * s, 224 * s, 28 * s, 32 * s, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#0284c7';
            ctx.beginPath();
            ctx.ellipse(cx * s, 226 * s, 19 * s, 22 * s, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#090d16';
            ctx.beginPath();
            ctx.arc(cx * s, 226 * s, 11 * s, 0, Math.PI * 2);
            ctx.fill();

            // Specular Glints
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc((cx - 7) * s, 216 * s, 6.5 * s, 0, Math.PI * 2);
            ctx.arc((cx + 7) * s, 234 * s, 3 * s, 0, Math.PI * 2);
            ctx.fill();
          }
          drawEye(194);
          drawEye(318);

          // 7. Red Ninja Headband & Silver Plate
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(104 * s, 160 * s, 304 * s, 40 * s);
          ctx.fillStyle = '#f8fafc';
          ctx.beginPath();
          ctx.roundRect(204 * s, 158 * s, 104 * s, 44 * s, 12 * s);
          ctx.fill();

          // 8. Golden 3D Sifir Badge at Bottom
          ctx.fillStyle = '#0f172a';
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 12 * s;
          ctx.beginPath();
          ctx.roundRect(96 * s, 370 * s, 320 * s, 88 * s, 30 * s);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#fef08a';
          ctx.font = '900 ' + Math.round(48 * s) + 'px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('7 × 8 = 56', 256 * s, 416 * s);

          return c.toDataURL('image/png');
        }

        var icon192 = createPixarPngIcon(192);
        var icon512 = createPixarPngIcon(512);
        window.__ninjaIcon512Png = icon512;

        var favLink = document.getElementById('favicon-link');
        if (favLink && icon192) favLink.href = icon192;

        var appleLink = document.getElementById('apple-touch-icon-link');
        if (appleLink && icon192) appleLink.href = icon192;

        var baseUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/');
        var dynamicManifest = {
          id: baseUrl,
          name: 'Ninja Sifir: Ragebound 3D — Math Ninja',
          short_name: 'Ninja Sifir 3D',
          description: 'Permainan aksi 3D gaya Disney Pixar untuk latihan sifir matematik 2 hingga 12 secara luar talian (Offline PWA).',
          start_url: window.location.origin + window.location.pathname,
          scope: baseUrl,
          display: 'standalone',
          orientation: 'any',
          background_color: '#090d16',
          theme_color: '#1e1b4b',
          icons: [
            {
              src: icon192,
              sizes: '192x192',
              type: 'image/png',
              purpose: 'any'
            },
            {
              src: icon512,
              sizes: '512x512',
              type: 'image/png',
              purpose: 'any maskable'
            }
          ]
        };

        var blob = new Blob([JSON.stringify(dynamicManifest)], { type: 'application/manifest+json' });
        var manifestUrl = URL.createObjectURL(blob);
        var manifestLink = document.getElementById('pwa-manifest-link');
        if (manifestLink) manifestLink.href = manifestUrl;
      } catch (err) {
        console.warn('Manifest setup fallback:', err);
      }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ninja: {
              red: '#ef4444',
              gold: '#f59e0b',
              dark: '#050811',
              blade: '#38bdf8'
            }
          }
        }
      }
    };
  </script>

    <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body, #root {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100dvh;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      margin: 0;
      padding: 0;
      background-color: #090d16;
      color: #f8fafc;
      overflow: hidden;
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased overflow-hidden select-none">
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>
</body>
</html>
